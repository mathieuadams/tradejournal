<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F131A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futures">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Tradejournal Futures</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230F131A'/><path d='M3 17l5-6 4 3 6-8 3 3' stroke='%234A9EFF' stroke-width='2' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="panel">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4A9EFF" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/></svg>
    <h1>Tradejournal Futures</h1>
    <p class="muted">NQ and ES: research, validate and paper trade strategies on Databento data.</p>
    <button class="btn primary" id="signin" style="width:100%;justify-content:center">Sign in</button>
    <p id="login-err" class="loss" hidden></p>
  </div>
</div>
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9EFF" stroke-width="2" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/></svg>
      <span>Tradejournal</span><span>Futures</span>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#running" data-r="running">Running</a>
      <a href="#chart" data-r="chart">Chart</a>
      <a href="#research" data-r="research">Research</a>
      <a href="#data" data-r="data">Data</a>
    </nav>
    <div class="grow"></div>
    <a href="#data" id="feed-pill" class="pill" style="text-decoration:none">Databento…</a>
    <div class="who"><span id="who-email"></span><button type="button" id="signout">Log out</button></div>
  </header>
  <main id="view"><p class="dim">Loading…</p></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
