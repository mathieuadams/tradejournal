<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#172231">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Trade Journal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><rect x='1' y='1' width='24' height='24' rx='6' fill='%23172231'/><path d='M7 17l4-5 3 3 5-7' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="panel">
    <svg width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--ink)"/><path d="M7 17l4-5 3 3 5-7" stroke="var(--surface)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Your AI coach finds your leaks in dollars</h1>
    <p>Import your trades, journal the plan, and see exactly which habits cost you money.</p>
    <button class="btn primary" id="signin" style="width:100%;padding:11px">Sign in or create an account</button>
    <p id="login-err" class="loss" style="margin:14px 0 0" hidden></p>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--ink)"/><path d="M7 17l4-5 3 3 5-7" stroke="var(--surface)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Trade Journal
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#dashboard" data-r="dashboard"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 10 4l7 6.5M5 9v7h10V9"/></svg>Home</a>
      <a href="#trades" data-r="trades"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h12M4 10h12M4 15h12"/></svg>Trades</a>
      <div class="nav-sub" hidden>
        <a href="#analytics" data-r="analytics">Stats</a>
        <a href="#coach" data-r="coach">Coach</a>
        <a href="#journal" data-r="journal">Journal</a>
      </div>
      <a href="#gex" data-r="gex"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10h14M6 10V5M9 10V3M12 10v4M15 10v6"/></svg>Analysis</a>
      <a href="#bot" data-r="bot"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="6" width="12" height="10" rx="2"/><path d="M10 3v3M7.5 10.5h.01M12.5 10.5h.01M8 13.5h4"/></svg>Paper bot</a>
      <a href="#account" class="nav-acct" data-acct aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="3"/><path d="M4 17c1-3.3 3.3-5 6-5s5 1.7 6 5"/></svg>Account</a>
    </nav>
    <div class="side-foot">
      <button type="button" class="who" data-acct aria-haspopup="menu" aria-expanded="false"><span class="who-avatar" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="3"/><path d="M4 17c1-3.3 3.3-5 6-5s5 1.7 6 5"/></svg></span><span id="who-email" class="who-email"></span><svg class="who-chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 12l4-4 4 4"/></svg></button>
    </div>
    <div id="acct-menu" class="acct-menu" role="menu" hidden>
      <a href="#settings" role="menuitem"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>Settings</a>
      <button type="button" id="signout" role="menuitem"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 4H4v12h4M12 6l4 4-4 4M16 10H8"/></svg>Log out</button>
    </div>
  </aside>
  <main id="view"><p class="loading">Loading your journal…</p></main>
</div>
<button id="refresh-btn" class="refresh-fab" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg></button>
<div id="pull-ind" class="pull-ind" aria-hidden="true">Pull to refresh</div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Trade detail"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
