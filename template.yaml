AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Trade Journal - journal, analytics and AI coach (Cognito, CloudFront, HTTP API, Lambda, DynamoDB, S3)

Parameters:
  AppName:
    Type: String
    Default: tradejournal
    AllowedPattern: "[a-z0-9-]{3,20}"
    Description: Lowercase name used in resource names
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "[a-z0-9-]{3,63}"
    Description: Globally unique prefix for the sign-in page, e.g. tradejournal-mathieu (no "aws", "amazon" or "cognito")
  ReviewModel:
    Type: String
    Default: claude-haiku-4-5-20251001
  CoachModel:
    Type: String
    Default: claude-sonnet-5

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE: !Ref Table
        UPLOAD_BUCKET: !Sub "${AppName}-uploads-${AWS::AccountId}-${AWS::Region}"
        ANTHROPIC_SECRET_ARN: !Ref AnthropicSecret
        KMS_KEY_ID: !Ref BrokerKey
        REVIEW_MODEL: !Ref ReviewModel
        COACH_MODEL: !Ref CoachModel

Resources:
  # ---------------- data ----------------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      StreamSpecification: { StreamViewType: NEW_IMAGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-uploads-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Sub "https://${Distribution.DomainName}", "http://localhost:5173"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  AnthropicSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Anthropic API key for the AI coach. Set with deploy.sh (ANTHROPIC_API_KEY) or put-secret-value.
      SecretString: REPLACE_ME

  BrokerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts users' broker API keys
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  # ---------------- auth ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AppName}-web"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/", "http://localhost:5173/"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/", "http://localhost:5173/"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ---------------- website ----------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AppName} web app"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt SiteOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          Compress: true
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------------- API ----------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}", "http://localhost:5173"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          SYNC_FUNCTION: !Ref SyncFunction
          WEEKLY_FUNCTION: !Ref WeeklyFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Sub "${AppName}-uploads-${AWS::AccountId}-${AWS::Region}" }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AnthropicSecret }
        - KMSEncryptPolicy: { KeyId: !Ref BrokerKey }
        - KMSDecryptPolicy: { KeyId: !Ref BrokerKey }
        - LambdaInvokePolicy: { FunctionName: !Ref SyncFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref WeeklyFunction }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ---------------- workers ----------------
  ImporterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: importer.handler
      MemorySize: 1024
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Sub "${AppName}-uploads-${AWS::AccountId}-${AWS::Region}" }
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: imports/ }]

  ReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: reviewer.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AnthropicSecret }
        - KMSDecryptPolicy: { KeyId: !Ref BrokerKey }
      Events:
        TradeInserted:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 5
            MaximumRetryAttempts: 2
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"Keys":{"SK":{"S":[{"prefix":"TRADE#"}]}}}}'

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sync.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - KMSDecryptPolicy: { KeyId: !Ref BrokerKey }
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 21 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York

  WeeklyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: weekly.handler
      Timeout: 600
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AnthropicSecret }
      Events:
        Sunday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10 ? * SUN *)
            ScheduleExpressionTimezone: America/New_York

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  SiteDomain:
    Value: !GetAtt Distribution.DomainName
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AnthropicSecretArn:
    Value: !Ref AnthropicSecret
  TableName:
    Value: !Ref Table
