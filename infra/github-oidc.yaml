AWSTemplateFormatVersion: "2010-09-09"
Description: Lets GitHub Actions in one repo deploy to this AWS account without stored access keys (OIDC).

Parameters:
  GitHubRepo:
    Type: String
    Default: mathieuadams/tradejournal
    Description: owner/repo allowed to deploy
  Branch:
    Type: String
    Default: main
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "github-deploy-${AWS::StackName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${Branch}"
      # The stack creates IAM roles, Cognito, CloudFront, KMS etc., so the deploy role needs broad rights.
      # Only workflows running on the chosen branch of the chosen repo can assume it.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: Put this in the GitHub repo variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
