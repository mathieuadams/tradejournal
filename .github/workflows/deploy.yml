name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for the AWS OIDC login
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm test

  deploy:
    needs: test
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.COGNITO_DOMAIN_PREFIX != '' }}
    runs-on: ubuntu-latest
    env:
      STACK: ${{ vars.STACK_NAME || 'trade-journal' }}
      REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
      SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - run: bash deploy.sh
      - name: Summary
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          CB=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='SchwabCallbackUrl'].OutputValue" --output text)
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Schwab callback URL to register: \`$CB\`" >> "$GITHUB_STEP_SUMMARY"
