AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Trading workspace: one small always-on server (live candles, paper broker, Claude proxy) behind CloudFront (HTTPS).
  deploy.sh uploads the code to the release bucket and restarts the service on every push to main.
  Alpaca keys are read from the journal app (Data page: DynamoDB item SK=DATASOURCE#alpaca, KMS-encrypted) at every start.
  Other secrets come from SSM Parameter Store under ParamPath (ANTHROPIC_API_KEY from the GitHub secret, WORKSPACE_PASSWORD, ORIGIN_SECRET).

Parameters:
  OriginSecret:
    Type: String
    NoEcho: true
    Description: Header value CloudFront adds; the server refuses requests without it
  ParamPath:
    Type: String
    Default: /tradejournal/workspace
  TableName:
    Type: String
    Description: The journal app's DynamoDB table (main stack output TableName)
  KeyArn:
    Type: String
    Description: The journal app's KMS key for data-vendor keys (main stack output BrokerKeyArn)
  AlpacaFeed:
    Type: String
    Default: iex
    AllowedValues: [iex, sip]
    Description: Live stream feed. iex is real time on Alpaca's free plan; sip needs the paid plan
  InstanceType:
    Type: String
    Default: t4g.micro
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  ReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration: { Rules: [{ Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 14 } }] }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: workspace
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${ReleaseBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ReleaseBucket.Arn
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPath}/*"
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref KeyArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trading workspace (port 8765; requests must carry the CloudFront origin secret)
      SecurityGroupIngress: [{ IpProtocol: tcp, FromPort: 8765, ToPort: 8765, CidrIp: 0.0.0.0/0 }]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings: [{ DeviceName: /dev/xvda, Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true } }]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf install -y python3.12 unzip
          id workspace || useradd -r -s /sbin/nologin workspace
          mkdir -p /opt/workspace /var/lib/workspace
          chown workspace /var/lib/workspace

          cat > /usr/local/bin/ws-update <<'SCRIPT'
          #!/bin/bash
          # Runs as root before every start: latest code from S3, secrets from SSM, data restored from S3 on a fresh disk.
          set -e
          B=${ReleaseBucket}; R=${AWS::Region}; P=${ParamPath}
          if aws s3 cp "s3://$B/release/workspace.zip" /tmp/ws.zip --region "$R" --quiet; then
            rm -rf /opt/workspace.new && mkdir /opt/workspace.new && unzip -q /tmp/ws.zip -d /opt/workspace.new
            rm -rf /opt/workspace && mv /opt/workspace.new /opt/workspace
          fi
          test -f /opt/workspace/server/server.py
          aws ssm get-parameters-by-path --path "$P" --with-decryption --region "$R" --query 'Parameters[].[Name,Value]' --output text \
            | while IFS=$'\t' read -r n v; do echo "${!n##*/}=$v"; done > /etc/workspace.env.new
          echo "ALPACA_FEED=${AlpacaFeed}" >> /etc/workspace.env.new
          # Alpaca keys: the ones saved in the journal app (Data -> Alpaca)
          ENC=$(aws dynamodb scan --table-name "${TableName}" --filter-expression "SK = :s" --expression-attribute-values '{":s":{"S":"DATASOURCE#alpaca"}}' \
            --projection-expression "enc" --region "$R" --query 'Items[0].enc.S' --output text || true)
          if [ -n "$ENC" ] && [ "$ENC" != "None" ]; then
            echo "$ENC" | base64 -d > /tmp/alp.bin
            aws kms decrypt --ciphertext-blob fileb:///tmp/alp.bin --region "$R" --query Plaintext --output text | base64 -d \
              | /usr/bin/python3.12 -c 'import json,sys; k,s=json.load(sys.stdin); print("ALPACA_KEY_ID="+k); print("ALPACA_SECRET_KEY="+s)' >> /etc/workspace.env.new
            rm -f /tmp/alp.bin
          fi
          chmod 600 /etc/workspace.env.new && mv /etc/workspace.env.new /etc/workspace.env
          if [ -z "$(ls -A /var/lib/workspace)" ]; then
            aws s3 sync "s3://$B/data/" /var/lib/workspace/ --region "$R" --quiet || true
            chown -R workspace /var/lib/workspace
          fi
          SCRIPT
          chmod 755 /usr/local/bin/ws-update

          cat > /etc/systemd/system/workspace.service <<'UNIT'
          [Unit]
          Description=Trading workspace
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=0
          [Service]
          User=workspace
          Environment=HOST=0.0.0.0 PORT=8765 DATA_DIR=/var/lib/workspace PYTHONUNBUFFERED=1
          EnvironmentFile=-/etc/workspace.env
          ExecStartPre=+/usr/local/bin/ws-update
          ExecStart=/usr/bin/python3.12 /opt/workspace/server/server.py
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
          UNIT

          cat > /etc/systemd/system/ws-backup.service <<UNIT
          [Unit]
          Description=Back up workspace data to S3
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/aws s3 sync /var/lib/workspace s3://${ReleaseBucket}/data/ --region ${AWS::Region} --exclude "*.tmp" --quiet
          UNIT
          cat > /etc/systemd/system/ws-backup.timer <<'UNIT'
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=5min
          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now workspace.service ws-backup.timer

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} trading workspace"
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: workspace
            DomainName: !GetAtt Instance.PublicDnsName
            CustomOriginConfig: { HTTPPort: 8765, OriginProtocolPolicy: http-only, OriginReadTimeout: 60, OriginKeepaliveTimeout: 60 }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Secret, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: workspace
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader (passes Authorization, query strings)
          Compress: false

Outputs:
  WorkspaceUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  InstanceId:
    Value: !Ref Instance
  ReleaseBucket:
    Value: !Ref ReleaseBucket
